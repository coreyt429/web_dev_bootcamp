<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    .container {
      display: grid;
      width: 748px;
      height: 748px;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 157px 20px;
      gap: 9px; /* Adjust gap as needed */
      background-color: #000; /* Gap Colour */
    }

    .red {
      background-color: #E72F24; /* Red */
      grid-column: 1;
      grid-row: 1 ;
    }

    .white.white1 {
      grid-column: 2 / 5;
      grid-row: 1;
    }
    .white.white2 {
      grid-column: 1;
      grid-row: 2 / 4;
    }
    .white.white3 {
      grid-column: 2 / 4;
      grid-row: 2 / 4;
    }
    .white.white4 {
      grid-column: 4;
      grid-row: 3 / 5;
    }
    .white.white5 {
      grid-column: 1;
      grid-row: 4;
    }

    .blue {
      background-color: #004592; /* Blue */
      grid-column: 4;
      grid-row: 2;
      padding-bottom: 1px;
    }

    .yellow {
      background-color: #F9D01E; /* Yellow */
      grid-column: 2;
      grid-row: 4;
    }

    .white {
      background-color: #F0F1EC; /* White */
    }
    .black {
      background-color: #232629; /* Black */
      grid-column: 3;
      grid-row: 4;
    }
    .item {
      display: flex;
      align-items: center;
      justify-content: center;
      color: white; /* Text color */
      font-size: 24px; /* Font size */
      font-weight: bold; /* Font weight */
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="container">
     <div class="item red"></div>
     <div class="item white white1"></div>
     <div class="item white white2"></div>
     <div class="item white white3"></div>
     <div class="item blue"></div>
     <div class="item white white4"></div>
     <div class="item white white5"></div>
     <div class="item black"></div>
     <div class="item yellow"></div>
   </div>
</body>

</html>
